name: Weekly SaaS Churn Radar

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live signals and generate weekly report
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python3 scripts/generate_weekly_report.py \
            --fetch \
            --output reports/latest.md

      - name: Commit updated report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md
          if git diff --staged --quiet; then
            echo "No changes to reports/latest.md"
          else
            git commit -m "chore: update weekly SaaS churn radar report"
            git push
          fi
